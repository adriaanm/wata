[package]
name = "iroh-tunnel"
version = "0.1.0"
edition = "2021"
description = "Tunnel the Matrix client-server API over an iroh QUIC connection so a Wata client can reach an always-on homeserver behind NAT without port forwarding or dynamic DNS."

[dependencies]
iroh = "1.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
n0-error = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
data-encoding = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
